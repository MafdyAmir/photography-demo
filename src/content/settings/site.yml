aboutShort: >-
  Shotix Studios is a Cairo photo and video team covering events, exhibitions, launches and brand content.
aboutText: |-
  Shotix Studios is a team of photographers and videographers based in Cairo. We cover live events, exhibitions, openings and brand content, in stills and film together.

  We've photographed booths at EGYPS, Food Africa and HACE Hotel Expo, comedy nights at City Garage, concerts at Village West, the Cairo Marathon and drift days for Sailun Tyre and Nacita.

  We also produce podcasts and real estate visuals. Ask us about them.
processSteps:
  - title: Brief
    text: You send the date, venue and what the coverage is for.
  - title: Plan
    text: We agree on crew, key moments and delivery formats.
  - title: Cover
    text: Photo and video crews work the event together.
  - title: Deliver
    text: Quick edits first, then the full gallery and films.
