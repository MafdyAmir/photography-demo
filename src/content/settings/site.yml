aboutShort: >-
  I'm a photographer based in Cairo, now focusing on product, brand and corporate photography.
  I bring years of experience working with light, people and tight timelines to commercial projects.
aboutText: |-
  I'm a photographer based in Cairo. I started out photographing events and people, which taught me how to work with changing light, direct people naturally and deliver on tight timelines.

  I'm now focusing on commercial work: product photography for online brands, campaign images for launches, and portraits and workplace photos for companies. The projects in my portfolio marked "Concept" are self-initiated shoots that show how I approach this kind of work.

  I keep things simple and clear: a written brief, a shot list we agree on, and images delivered ready for where you'll use them.
processSteps:
  - title: Brief
    text: You tell me about your brand, products and where the images will be used.
  - title: Plan
    text: I send a shot list, references and a clear quote.
  - title: Shoot
    text: In the studio or on location, with your feedback during the shoot if you want it.
  - title: Deliver
    text: Edited, web-ready images delivered online in the formats you need.
