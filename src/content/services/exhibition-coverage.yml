title: Exhibition Coverage
category: exhibitions
order: 2
cardSummary: Your booth, products and visitor conversations, captured for the post-show push.
intro: >-
  Booth photography and video at trade shows and exhibitions: the stand, the products, the team
  and every conversation with visitors, ready for your post-show posts and reports.
whoItsFor: >-
  Exhibitors and marketing teams at shows like EGYPS, Food Africa and HACE who need their stand
  and their brand presence documented while the show is still running.
deliverables:
  - Booth, product and detail photography
  - Team and visitor portraits
  - Highlight film of the stand
  - Same-day reels while the show is on
process:
  - title: Brief
    text: You share the show, hall, booth number and the moments that matter to you.
  - title: Plan
    text: We agree on shooting days, key visits and what you need for social each day.
  - title: Cover
    text: We shoot the stand quiet and busy, the products up close, and the meetings.
  - title: Deliver
    text: Daily selects during the show, the full set and film right after.
