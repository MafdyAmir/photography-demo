title: Corporate Photography
category: corporate
order: 3
cardSummary: Team portraits, leadership headshots and workplace images for websites and LinkedIn.
intro: >-
  Professional, natural-looking portraits of your team and real images of your workplace,
  so your company looks as credible online as it is in person.
whoItsFor: >-
  Companies, startups and founders who need team photos, leadership headshots or office and event
  images for their website, LinkedIn and recruitment.
deliverables:
  - Individual portraits with a consistent look
  - Leadership and founder headshots
  - Workplace and team-at-work images
  - Crops ready for website and LinkedIn
process:
  - title: Brief
    text: You share how many people, where the images will be used and the look you want.
  - title: Plan
    text: We agree on locations in your space, a schedule and a simple shot list.
  - title: Shoot
    text: I photograph on site with portable lighting, keeping it quick for your team.
  - title: Deliver
    text: You receive edited portraits and workplace images ready to publish.
heroImage:
  src: ../../assets/uploads/service-corporate-photography-hero.jpg
  alt: "Smiling woman presenting at a whiteboard in a bright office"
seo:
  title: Corporate Photography — Team Portraits & Workplace
  description: Corporate photography for companies and startups — team portraits, leadership headshots and workplace images.
