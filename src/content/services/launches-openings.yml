title: Launches & Openings
category: launches
order: 3
cardSummary: Store openings, gallery nights and brand activations, from first guest to last.
intro: >-
  Coverage for openings and launches: the space before the doors open, the first guests,
  and the energy of the day, in photos and film you can use for months.
whoItsFor: >-
  Brands, stores, galleries and developers opening a space or launching something new
  who want the first impression on record.
deliverables:
  - Space and interior photography
  - Guest and atmosphere coverage
  - Launch film and reels
  - Same-day or next-day edits for social
process:
  - title: Brief
    text: You tell us what's opening, when, and who should be in the pictures.
  - title: Plan
    text: We plan the empty-space shots, the arrivals and the key moments.
  - title: Cover
    text: We shoot the space first, then the people and the atmosphere.
  - title: Deliver
    text: Quick selects for launch posts, then the full gallery and film.
